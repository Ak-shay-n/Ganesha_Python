<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ganesha Metallic Gold Clean Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #181b22;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: min(850px, 95vw);
            height: min(850px, 80vh);
        }

        button {
            margin-top: 15px;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            background: #f5c842;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #d49b24;
        }

        #status {
            margin-top: 8px;
            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <canvas id="canvas" width="850" height="850"></canvas>

    <button onclick="startAnimation()">
        Replay Animation
    </button>

    <div id="status">
        Loading...
    </div>

</div>

<script src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const bgColor = "#181b22";
const goldStroke = "#D49B24";
const goldFill = "#F5C842";

const targetWidth = 650;

let targetHeight = 0;
let contoursData = [];
let animationIndex = 0;
let animationRunning = false;


/* ==============================
   LOAD IMAGE
================================ */

const image = new Image();

image.onload = function () {

    /* Same calculation as Python */

    targetHeight =
        Math.round(
            (image.height / image.width) *
            targetWidth
        );


    /*
        Draw image to temporary canvas
        at EXACTLY the same dimensions
        used by your Python code.
    */

    const tempCanvas =
        document.createElement("canvas");

    tempCanvas.width = targetWidth;
    tempCanvas.height = targetHeight;

    const tempCtx =
        tempCanvas.getContext("2d");

    tempCtx.drawImage(
        image,
        0,
        0,
        targetWidth,
        targetHeight
    );


    processImage(tempCanvas);
};


/* ==============================
   OPENCV PROCESSING
================================ */

function processImage(tempCanvas) {

    document.getElementById("status").innerText =
        "Processing Ganesha...";


    const src = cv.imread(tempCanvas);

    const gray = new cv.Mat();
    const thresh = new cv.Mat();

    /*
        Same as:

        gray = cv2.cvtColor(
            img_resized,
            cv2.COLOR_BGR2GRAY
        )
    */

    cv.cvtColor(
        src,
        gray,
        cv.COLOR_RGBA2GRAY
    );


    /*
        Same threshold as Python
    */

    cv.threshold(
        gray,
        thresh,
        70,
        255,
        cv.THRESH_BINARY
    );


    /*
        Same contour retrieval:

        cv2.RETR_TREE
        cv2.CHAIN_APPROX_NONE
    */

    const contours =
        new cv.MatVector();

    const hierarchy =
        new cv.Mat();

    cv.findContours(
        thresh,
        contours,
        hierarchy,
        cv.RETR_TREE,
        cv.CHAIN_APPROX_NONE
    );


    const hierarchyData =
        hierarchy.data32S;


    /* ==============================
       STORE CONTOURS
    ================================= */

    for (
        let i = 0;
        i < contours.size();
        i++
    ) {

        const contour =
            contours.get(i);

        const area =
            cv.contourArea(contour);


        /*
            EXACT same filtering
            as Python.
        */

        if (
            area < 15 ||
            area >
            targetWidth *
            targetHeight *
            0.45
        ) {

            contour.delete();

            continue;
        }


        /*
            EXACT same hierarchy-depth
            calculation.
        */

        let depth = 0;

        let parent =
            hierarchyData[i * 4 + 3];


        while (parent !== -1) {

            depth++;

            parent =
                hierarchyData[parent * 4 + 3];
        }


        /*
            Store every contour point.
        */

        const points = [];

        const data =
            contour.data32S;


        for (
            let j = 0;
            j < contour.rows;
            j++
        ) {

            points.push({

                x: data[j * 2],

                y: data[j * 2 + 1]

            });
        }


        contoursData.push({

            points: points,

            depth: depth

        });


        contour.delete();
    }


    src.delete();
    gray.delete();
    thresh.delete();
    contours.delete();
    hierarchy.delete();


    document.getElementById("status").innerText =
        "Ready";

    startAnimation();
}


/* ==============================
   DRAW CONTOUR
================================ */

function drawContour(contour) {

    const points =
        contour.points;


    if (!points.length) {
        return;
    }


    /*
        THIS IS THE IMPORTANT PART.

        Your Python code does:

        offset_x = target_width / 2
        offset_y = target_height / 2

        x = point.x - offset_x
        y = offset_y - point.y

        We reproduce that EXACTLY.
    */

    const offsetX =
        targetWidth / 2;

    const offsetY =
        targetHeight / 2;


    /*
        Canvas is 850x850,
        exactly like:

        screen.setup(
            width=850,
            height=850
        )
    */

    ctx.beginPath();


    for (
        let i = 0;
        i < points.length;
        i++
    ) {

        const point =
            points[i];


        /*
            Python:

            pen.goto(
                x - offset_x,
                offset_y - y
            )

            Canvas coordinates start
            from TOP-LEFT, so convert
            Turtle coordinates accordingly.
        */

        const x =
            canvas.width / 2 +
            (point.x - offsetX);


        const y =
            canvas.height / 2 +
            (offsetY - point.y);


        if (i === 0) {

            ctx.moveTo(x, y);

        } else {

            ctx.lineTo(x, y);
        }
    }


    ctx.closePath();


    /*
        Same depth logic as Python.
    */

    if (contour.depth % 2 === 1) {

        ctx.strokeStyle =
            goldStroke;

        ctx.fillStyle =
            bgColor;

    } else {

        ctx.strokeStyle =
            goldStroke;

        ctx.fillStyle =
            goldFill;
    }


    ctx.lineWidth = 1.5;

    ctx.fill();

    ctx.stroke();
}


/* ==============================
   ANIMATION
================================ */

function animate() {

    if (!animationRunning) {
        return;
    }


    if (
        animationIndex >=
        contoursData.length
    ) {

        animationRunning = false;

        document.getElementById("status").innerText =
            "Animation complete";

        return;
    }


    drawContour(
        contoursData[animationIndex]
    );


    animationIndex++;


    /*
        Slight delay so the drawing
        looks like an actual animation.
    */

    requestAnimationFrame(animate);
}


/* ==============================
   START / REPLAY
================================ */

function startAnimation() {

    if (!contoursData.length) {
        return;
    }


    /*
        Same background as Python.
    */

    ctx.fillStyle =
        bgColor;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    animationIndex = 0;

    animationRunning = true;


    document.getElementById("status").innerText =
        "Drawing Ganesha...";


    requestAnimationFrame(
        animate
    );
}


/* ==============================
   INITIALIZE
================================ */

image.src = "ganesh.jpg";

</script>

</body>
</html>

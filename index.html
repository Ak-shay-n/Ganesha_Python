<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Ganesha</title>


    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: #181b22;

            overflow: hidden;
        }


        body {

            display: flex;

            justify-content: center;
            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            position: relative;
        }


        /* =========================
           CANVAS
        ========================= */

        canvas {

            display: block;

            width: min(850px, 96vw);

            height: min(850px, 88vh);

            max-width: 96vw;
            max-height: 88dvh;

            object-fit: contain;
        }


        /* =========================
           REPLAY BUTTON
        ========================= */

        .replay {

            position: absolute;

            bottom: 28px;

            left: 50%;

            transform:
                translateX(-50%);

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 9px;

            padding: 11px 22px;

            border: 1px solid
                rgba(245, 200, 66, 0.45);

            border-radius: 999px;

            background:
                rgba(245, 200, 66, 0.10);

            color: #F5C842;

            font-size: 14px;

            font-weight: 600;

            letter-spacing: 0.3px;

            cursor: pointer;

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            box-shadow:
                0 0 20px
                rgba(245, 200, 66, 0.08);

            transition:
                background 0.25s ease,
                border 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.2s ease;
        }


        .replay-icon {

            font-size: 17px;

            line-height: 1;

            transition:
                transform 0.5s ease;
        }


        .replay:hover {

            background:
                rgba(245, 200, 66, 0.18);

            border-color:
                rgba(245, 200, 66, 0.75);

            box-shadow:
                0 0 25px
                rgba(245, 200, 66, 0.16);

            transform:
                translateX(-50%)
                translateY(-2px);
        }


        .replay:hover
        .replay-icon {

            transform:
                rotate(180deg);
        }


        .replay:active {

            transform:
                translateX(-50%)
                scale(0.96);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            canvas {

                /*
                    Give the drawing much more
                    usable space on mobile.
                */

                width: 110vw;

                height: 82dvh;

                max-width: none;
                max-height: none;
            }


            .replay {

                bottom: 22px;

                padding:
                    12px 21px;

                font-size: 14px;
            }
        }


        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-height: 650px) {

            canvas {

                height: 78dvh;
            }


            .replay {

                bottom: 14px;
            }
        }


    </style>

</head>


<body>


<div class="container">


    <canvas
        id="canvas"
        width="850"
        height="850">
    </canvas>


    <button
        class="replay"
        onclick="startAnimation()">

        <span class="replay-icon">↻</span>

        <span>Replay</span>

    </button>


</div>



<!-- =========================
     OPENCV
========================= -->

<script
    src="https://docs.opencv.org/4.x/opencv.js">
</script>



<script>

/* ==============================
   CANVAS
================================ */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/* ==============================
   COLORS
================================ */

const bgColor =
    "#181b22";

const goldStroke =
    "#D49B24";

const goldFill =
    "#F5C842";


/* ==============================
   PYTHON VALUES
================================ */

const targetWidth = 650;

let targetHeight = 0;


/* ==============================
   CONTOURS
================================ */

let contoursData = [];


/* ==============================
   ANIMATION
================================ */

let contourIndex = 0;

let pointIndex = 0;

let animationRunning = false;


/*
    DRAWING SPEED

    1 = very slow
    2 = slow
    3 = smooth
    4 = faster
*/

const pointsPerFrame = 2;


/* ==============================
   RESPONSIVE SCALE
================================ */

function getDrawingScale() {

    const width =
        window.innerWidth;

    /*
        Desktop:
        almost exactly Python size.

        Mobile:
        enlarge Ganesha so it doesn't
        look tiny.
    */

    if (width <= 600) {

        return 1.28;

    }

    if (width <= 900) {

        return 1.10;

    }

    return 1.0;
}


/* ==============================
   CLEAR CANVAS
================================ */

function clearCanvas() {

    ctx.fillStyle =
        bgColor;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


clearCanvas();


/* ==============================
   LOAD IMAGE
================================ */

const image =
    new Image();


image.onload = function () {

    /*
        EXACT SAME IMAGE
        RESIZE LOGIC AS PYTHON
    */

    targetHeight =
        Math.round(
            (image.height / image.width)
            * targetWidth
        );


    const tempCanvas =
        document.createElement("canvas");


    tempCanvas.width =
        targetWidth;


    tempCanvas.height =
        targetHeight;


    const tempCtx =
        tempCanvas.getContext("2d");


    tempCtx.drawImage(
        image,
        0,
        0,
        targetWidth,
        targetHeight
    );


    processImage(tempCanvas);
};


/* ==============================
   OPENCV PROCESSING
================================ */

function processImage(tempCanvas) {

    const src =
        cv.imread(tempCanvas);


    const gray =
        new cv.Mat();


    const thresh =
        new cv.Mat();


    /*
        Python:

        cv2.cvtColor(...)
    */

    cv.cvtColor(
        src,
        gray,
        cv.COLOR_RGBA2GRAY
    );


    /*
        Python:

        cv2.threshold(
            gray,
            70,
            255,
            cv2.THRESH_BINARY
        )
    */

    cv.threshold(
        gray,
        thresh,
        70,
        255,
        cv.THRESH_BINARY
    );


    /*
        Python:

        cv2.findContours(
            thresh,
            cv2.RETR_TREE,
            cv2.CHAIN_APPROX_NONE
        )
    */

    const contours =
        new cv.MatVector();


    const hierarchy =
        new cv.Mat();


    cv.findContours(
        thresh,
        contours,
        hierarchy,
        cv.RETR_TREE,
        cv.CHAIN_APPROX_NONE
    );


    const hierarchyData =
        hierarchy.data32S;


    /* ==========================
       EXTRACT CONTOURS
    ========================== */

    for (
        let i = 0;
        i < contours.size();
        i++
    ) {

        const contour =
            contours.get(i);


        const area =
            cv.contourArea(contour);


        /*
            EXACT PYTHON FILTER
        */

        if (
            area < 15 ||
            area >
            targetWidth *
            targetHeight *
            0.45
        ) {

            contour.delete();

            continue;
        }


        /* ==========================
           HIERARCHY DEPTH
        ========================== */

        let depth = 0;


        let parent =
            hierarchyData[
                i * 4 + 3
            ];


        while (parent !== -1) {

            depth++;


            parent =
                hierarchyData[
                    parent * 4 + 3
                ];
        }


        /* ==========================
           POINTS
        ========================== */

        const points = [];


        const data =
            contour.data32S;


        for (
            let j = 0;
            j < contour.rows;
            j++
        ) {

            points.push({

                x:
                    data[j * 2],

                y:
                    data[j * 2 + 1]
            });
        }


        contoursData.push({

            points: points,

            depth: depth
        });


        contour.delete();
    }


    /* ==========================
       CLEAN OPENCV MEMORY
    ========================== */

    src.delete();

    gray.delete();

    thresh.delete();

    contours.delete();

    hierarchy.delete();


    /*
        Start automatically.
    */

    setTimeout(
        startAnimation,
        500
    );
}


/* ==============================
   PYTHON → CANVAS COORDINATES
================================ */

function convertPoint(point) {

    const offsetX =
        targetWidth / 2;


    const offsetY =
        targetHeight / 2;


    /*
        Responsive enlargement
    */

    const scale =
        getDrawingScale();


    /*
        Python Turtle:

        x =
            point.x - offsetX

        y =
            offsetY - point.y

        Canvas conversion:
        Y is inverted relative
        to Turtle.
    */

    const x =
        canvas.width / 2 +
        (point.x - offsetX)
        * scale;


    const y =
        canvas.height / 2 +
        (point.y - offsetY)
        * scale;


    return {
        x: x,
        y: y
    };
}


/* ==============================
   DRAW SEGMENT
================================ */

function drawSegment(
    previousPoint,
    currentPoint
) {

    const p1 =
        convertPoint(
            previousPoint
        );


    const p2 =
        convertPoint(
            currentPoint
        );


    ctx.beginPath();


    ctx.moveTo(
        p1.x,
        p1.y
    );


    ctx.lineTo(
        p2.x,
        p2.y
    );


    /*
        Metallic gold
    */

    ctx.strokeStyle =
        goldStroke;


    ctx.lineWidth = 1.5;


    ctx.lineCap =
        "round";


    ctx.lineJoin =
        "round";


    /*
        Very subtle glow
    */

    ctx.shadowColor =
        "rgba(245, 200, 66, 0.18)";

    ctx.shadowBlur = 3;


    ctx.stroke();


    /*
        Turn glow off so it
        doesn't affect fills.
    */

    ctx.shadowBlur = 0;
}


/* ==============================
   FILL CONTOUR
================================ */

function fillContour(contour) {

    const points =
        contour.points;


    if (
        points.length < 3
    ) {

        return;
    }


    ctx.beginPath();


    for (
        let i = 0;
        i < points.length;
        i++
    ) {

        const p =
            convertPoint(
                points[i]
            );


        if (i === 0) {

            ctx.moveTo(
                p.x,
                p.y
            );

        } else {

            ctx.lineTo(
                p.x,
                p.y
            );
        }
    }


    ctx.closePath();


    /*
        Same hierarchy logic
        as your Python code.
    */

    if (
        contour.depth % 2 === 1
    ) {

        ctx.fillStyle =
            bgColor;

    } else {

        ctx.fillStyle =
            goldFill;
    }


    ctx.fill();
}


/* ==============================
   ANIMATION LOOP
================================ */

function animate() {

    if (!animationRunning) {

        return;
    }


    /*
        Finished all contours
    */

    if (
        contourIndex >=
        contoursData.length
    ) {

        animationRunning =
            false;

        return;
    }


    const contour =
        contoursData[
            contourIndex
        ];


    const points =
        contour.points;


    /*
        Draw only a few points
        per frame.
    */

    for (
        let k = 0;
        k < pointsPerFrame;
        k++
    ) {

        if (
            pointIndex > 0
        ) {

            drawSegment(

                points[
                    pointIndex - 1
                ],

                points[
                    pointIndex
                ]
            );
        }


        pointIndex++;


        /*
            Finished contour
        */

        if (
            pointIndex >=
            points.length
        ) {

            /*
                Close outline
            */

            drawSegment(

                points[
                    points.length - 1
                ],

                points[0]
            );


            /*
                Fill AFTER
                outline is drawn.
            */

            fillContour(
                contour
            );


            contourIndex++;

            pointIndex = 0;


            break;
        }
    }


    requestAnimationFrame(
        animate
    );
}


/* ==============================
   START / REPLAY
================================ */

function startAnimation() {

    if (
        contoursData.length === 0
    ) {

        return;
    }


    clearCanvas();


    contourIndex = 0;

    pointIndex = 0;

    animationRunning = true;


    requestAnimationFrame(
        animate
    );
}


function waitForOpenCV() {

    if (
        typeof cv !== "undefined" &&
        cv.Mat
    ) {

        /*
            OpenCV is ready.
            NOW load the image.
        */

        image.src = "ganesh.jpg";

    } else {

        /*
            Keep checking until
            OpenCV has loaded.
        */

        setTimeout(
            waitForOpenCV,
            100
        );
    }
}


waitForOpenCV();

</script>

</body>
</html>

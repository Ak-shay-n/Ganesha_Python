<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ganesha Metallic Gold Clean Animation</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #181b22;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 850px;
            height: 850px;

            max-width: 95vw;
            max-height: 85vh;

            display: block;
        }

        button {
            margin-top: 5px;

            padding: 11px 28px;

            border: none;
            border-radius: 8px;

            background: #F5C842;
            color: white;

            font-size: 15px;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #D49B24;
            transform: scale(1.03);
        }

        #status {
            margin-top: 8px;

            color: #aaa;

            font-size: 13px;
        }

    </style>

</head>


<body>

<div class="container">

    <canvas
        id="canvas"
        width="850"
        height="850">
    </canvas>

    <button onclick="startAnimation()">
        Replay Animation
    </button>

    <div id="status">
        Loading...
    </div>

</div>


<script src="https://docs.opencv.org/4.x/opencv.js"></script>


<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/* ==============================
   COLORS
================================ */

const bgColor = "#181b22";

const goldStroke = "#D49B24";

const goldFill = "#F5C842";


/* ==============================
   SAME VALUES AS PYTHON
================================ */

const targetWidth = 650;

let targetHeight = 0;


/* ==============================
   CONTOURS
================================ */

let contoursData = [];


/* ==============================
   ANIMATION VARIABLES
================================ */

let contourIndex = 0;

let pointIndex = 0;

let animationRunning = false;


/*
    THIS CONTROLS THE SPEED.

    Smaller number = slower.

    Try:

    1  = VERY slow
    2  = slow
    4  = medium
    8  = fast
*/

const pointsPerFrame = 2;


/* ==============================
   BACKGROUND
================================ */

function clearCanvas() {

    ctx.fillStyle = bgColor;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


clearCanvas();


/* ==============================
   LOAD IMAGE
================================ */

const image = new Image();


image.onload = function () {

    /*
        EXACT SAME CALCULATION
        AS YOUR PYTHON CODE.
    */

    targetHeight =
        Math.round(
            (image.height / image.width) *
            targetWidth
        );


    /*
        Temporary canvas
        for OpenCV.
    */

    const tempCanvas =
        document.createElement("canvas");

    tempCanvas.width =
        targetWidth;

    tempCanvas.height =
        targetHeight;


    const tempCtx =
        tempCanvas.getContext("2d");


    tempCtx.drawImage(
        image,
        0,
        0,
        targetWidth,
        targetHeight
    );


    processImage(tempCanvas);
};


/* ==============================
   PROCESS IMAGE
================================ */

function processImage(tempCanvas) {

    document.getElementById("status").innerText =
        "Processing Ganesha...";


    const src =
        cv.imread(tempCanvas);


    const gray =
        new cv.Mat();


    const thresh =
        new cv.Mat();


    /*

        Python:

        gray = cv2.cvtColor(
            img_resized,
            cv2.COLOR_BGR2GRAY
        )

    */

    cv.cvtColor(
        src,
        gray,
        cv.COLOR_RGBA2GRAY
    );


    /*

        Python:

        _, thresh = cv2.threshold(
            gray,
            70,
            255,
            cv2.THRESH_BINARY
        )

    */

    cv.threshold(
        gray,
        thresh,
        70,
        255,
        cv.THRESH_BINARY
    );


    /*

        Python:

        cv2.findContours(
            thresh,
            cv2.RETR_TREE,
            cv2.CHAIN_APPROX_NONE
        )

    */

    const contours =
        new cv.MatVector();


    const hierarchy =
        new cv.Mat();


    cv.findContours(
        thresh,
        contours,
        hierarchy,
        cv.RETR_TREE,
        cv.CHAIN_APPROX_NONE
    );


    const hierarchyData =
        hierarchy.data32S;


    /* ==============================
       CONVERT CONTOURS
    ================================= */

    for (
        let i = 0;
        i < contours.size();
        i++
    ) {

        const contour =
            contours.get(i);


        const area =
            cv.contourArea(contour);


        /*
            SAME FILTER AS PYTHON
        */

        if (
            area < 15 ||
            area >
            targetWidth *
            targetHeight *
            0.45
        ) {

            contour.delete();

            continue;
        }


        /* ==========================
           HIERARCHY DEPTH
        ========================== */

        let depth = 0;


        let parent =
            hierarchyData[
                i * 4 + 3
            ];


        while (parent !== -1) {

            depth++;


            parent =
                hierarchyData[
                    parent * 4 + 3
                ];
        }


        /* ==========================
           EXTRACT POINTS
        ========================== */

        const points = [];


        const data =
            contour.data32S;


        for (
            let j = 0;
            j < contour.rows;
            j++
        ) {

            points.push({

                x: data[j * 2],

                y: data[j * 2 + 1]

            });
        }


        contoursData.push({

            points: points,

            depth: depth

        });


        contour.delete();
    }


    src.delete();

    gray.delete();

    thresh.delete();

    contours.delete();

    hierarchy.delete();


    document.getElementById("status").innerText =
        "Ready";


    /*
        START AUTOMATICALLY
    */

    setTimeout(
        startAnimation,
        500
    );
}


/* ==============================
   CONVERT PYTHON TURTLE
   COORDINATES → CANVAS
================================ */

function convertPoint(point) {

    /*
        Python:

        offset_x = target_width / 2
        offset_y = target_height / 2

        Turtle:

        x = point.x - offset_x

        y = offset_y - point.y


        Canvas starts at TOP-LEFT.

        Therefore:

        canvasX =
            425 + turtleX

        canvasY =
            425 - turtleY


        Which simplifies to:

        canvasX =
            425 + point.x - 325

        canvasY =
            (850-targetHeight)/2 + point.y

        THIS FIXES THE UPSIDE-DOWN
        PROBLEM.
    */


    const offsetX =
        targetWidth / 2;


    const offsetY =
        targetHeight / 2;


    const x =
        canvas.width / 2 +
        (point.x - offsetX);


    const y =
        canvas.height / 2 -
        (offsetY - point.y);


    return {
        x: x,
        y: y
    };
}


/* ==============================
   DRAW ONE LINE SEGMENT
================================ */

function drawSegment(
    previousPoint,
    currentPoint
) {

    const p1 =
        convertPoint(previousPoint);


    const p2 =
        convertPoint(currentPoint);


    ctx.beginPath();


    ctx.moveTo(
        p1.x,
        p1.y
    );


    ctx.lineTo(
        p2.x,
        p2.y
    );


    ctx.strokeStyle =
        goldStroke;


    ctx.lineWidth = 1.5;


    ctx.lineCap = "round";


    ctx.lineJoin = "round";


    ctx.stroke();
}


/* ==============================
   FILL COMPLETED CONTOUR
================================ */

function fillContour(contour) {

    const points =
        contour.points;


    if (points.length < 3) {
        return;
    }


    ctx.beginPath();


    for (
        let i = 0;
        i < points.length;
        i++
    ) {

        const p =
            convertPoint(points[i]);


        if (i === 0) {

            ctx.moveTo(
                p.x,
                p.y
            );

        } else {

            ctx.lineTo(
                p.x,
                p.y
            );
        }
    }


    ctx.closePath();


    /*
        Same hierarchy logic
        as Python.
    */

    if (
        contour.depth % 2 === 1
    ) {

        /*
            Hole
        */

        ctx.fillStyle =
            bgColor;

    } else {

        /*
            Gold shape
        */

        ctx.fillStyle =
            goldFill;
    }


    ctx.fill();
}


/* ==============================
   ANIMATION LOOP
================================ */

function animate() {

    if (!animationRunning) {
        return;
    }


    /*
        Have we finished
        all contours?
    */

    if (
        contourIndex >=
        contoursData.length
    ) {

        animationRunning = false;


        document.getElementById("status").innerText =
            "Animation complete";


        return;
    }


    const contour =
        contoursData[contourIndex];


    const points =
        contour.points;


    /*
        Draw only a FEW points
        each frame.
    */

    for (
        let k = 0;
        k < pointsPerFrame;
        k++
    ) {

        /*
            First point doesn't have
            a previous point.
        */

        if (
            pointIndex > 0
        ) {

            drawSegment(
                points[pointIndex - 1],
                points[pointIndex]
            );
        }


        pointIndex++;


        /*
            Finished this contour
        */

        if (
            pointIndex >=
            points.length
        ) {

            /*
                Close the contour
            */

            drawSegment(
                points[points.length - 1],
                points[0]
            );


            /*
                Fill AFTER drawing
                the complete outline.
            */

            fillContour(contour);


            /*
                Move to next contour
            */

            contourIndex++;

            pointIndex = 0;


            break;
        }
    }


    /*
        Continue drawing on next
        browser frame.
    */

    requestAnimationFrame(
        animate
    );
}


/* ==============================
   START / REPLAY
================================ */

function startAnimation() {

    if (
        contoursData.length === 0
    ) {

        return;
    }


    clearCanvas();


    contourIndex = 0;

    pointIndex = 0;

    animationRunning = true;


    document.getElementById("status").innerText =
        "Drawing Ganesha...";


    requestAnimationFrame(
        animate
    );
}


/* ==============================
   START
================================ */

image.src = "ganesh.jpg";

</script>

</body>
</html>
